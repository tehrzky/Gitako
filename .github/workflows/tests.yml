name: Build Gitako

on:
  push:
    branches: [develop, master, main, tehrzky-patch-2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Clean install
        run: |
          rm -rf node_modules
          npm cache clean --force
          npm install --legacy-peer-deps
      - name: Verify installation
        run: |
          npm list ajv
          npm list ajv-keywords
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: gitako-built
          path: build/
